[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctm-number-provisioner"
version = "0.1.0"
description = "Standalone local MCP server for searching, buying, and configuring CallTrackingMetrics tracking numbers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
ctm-number-provisioner = "ctm_numbers.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctm_numbers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]